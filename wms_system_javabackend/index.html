<html lang="zh-CN">
<head>

  <style>
    :root {
      --cyan: rgba(0, 205, 255, .9);
      --cyan-soft: rgba(0, 180, 255, .16);
      --yellow: rgba(255, 202, 71, .95);
      --yellow-soft: rgba(255, 184, 0, .16);
      --panel: rgba(3, 14, 32, .72);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #020712;
      color: #d8f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
    }
    body { display: grid; place-items: center; }
    .stage {
      position: relative;
      width: min(100vw, 2048px);
      aspect-ratio: 4 / 1;
      max-height: 100vh;
      background: #020712;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 136, 255, .22);
    }
    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      outline: none;
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease, transform .12s ease;
    }
    .hotspot:hover, .hotspot:focus-visible, .show-hotspots .hotspot {
      border-color: var(--cyan);
      background: var(--cyan-soft);
      box-shadow: 0 0 18px rgba(0, 208, 255, .42), inset 0 0 12px rgba(0, 208, 255, .25);
      transform: translateZ(0);
    }
    .hotspot.feature:hover, .hotspot.feature:focus-visible, .show-hotspots .hotspot.feature {
      border-color: var(--yellow);
      background: var(--yellow-soft);
      box-shadow: 0 0 18px rgba(255, 193, 7, .42), inset 0 0 12px rgba(255, 193, 7, .22);
    }
    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      transform: translateX(-50%);
      min-width: max-content;
      max-width: 260px;
      padding: 5px 9px;
      border: 1px solid rgba(0, 198, 255, .6);
      border-radius: 8px;
      background: rgba(2, 12, 30, .92);
      color: #e9fbff;
      font-size: clamp(10px, 0.72vw, 13px);
      line-height: 1.2;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 211, 255, .8);
      opacity: 0;
      pointer-events: none;
      transition: opacity .1s ease;
      z-index: 5;
    }
    .hotspot:hover::after, .hotspot:focus-visible::after, .show-hotspots .hotspot::after { opacity: 1; }
    .hotspot.nav::after { bottom: calc(100% + 9px); }
    .statusbar {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 11px;
      border: 1px solid rgba(0, 186, 255, .25);
      border-radius: 999px;
      background: rgba(0, 8, 20, .24);
      backdrop-filter: blur(6px);
      font-size: clamp(10px, 0.75vw, 13px);
      color: rgba(219, 249, 255, .72);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
      z-index: 10;
    }
    .stage:hover .statusbar, .show-hotspots .statusbar { opacity: 1; }
    .statusbar kbd {
      border: 1px solid rgba(219, 249, 255, .3);
      border-radius: 5px;
      padding: 1px 5px;
      background: rgba(255,255,255,.06);
      color: rgba(219, 249, 255, .85);
      font-family: inherit;
    }
    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      padding: 24px;
      overflow: auto;
      background: #020712;
      color: #d8f5ff;
      line-height: 1.7;
    }
    @media (max-aspect-ratio: 4/1) {
      .stage { width: 100vw; }
    }
    @media (min-aspect-ratio: 4/1) {
      .stage { height: 100vh; width: min(100vw, 400vh); }
    }
  </style>
</head>

    const defaultScreen = 'home';
    const stage = document.getElementById('stage');
    const img = document.getElementById('screen');
    const hotspotLayer = document.getElementById('hotspots');
    const screenLabel = document.getElementById('screenLabel');
    let current = defaultScreen;

    function validScreen(id) { return Object.prototype.hasOwnProperty.call(screens, id); }

    function setHash(id) {
      if (location.hash.slice(1) !== id) location.hash = id;
      else render(id);
    }

    function render(id) {
      if (!validScreen(id)) id = defaultScreen;
      current = id;
      const screen = screens[id];
      img.src = screen.src;
      img.alt = screen.label + '，HL-3 控制大厅数字孪生系统交互原型截图';
      screenLabel.textContent = screen.label;
      hotspotLayer.innerHTML = '';
      const hs = hotspotConfig[id] || [];
      hs.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'hotspot ' + (item.kind || '');
        btn.style.left = item.x + '%';
        btn.style.top = item.y + '%';
        btn.style.width = item.w + '%';
        btn.style.height = item.h + '%';
        btn.dataset.target = item.target;
        btn.dataset.label = item.label;
        btn.setAttribute('aria-label', item.label);
        btn.addEventListener('click', () => setHash(item.target));
        hotspotLayer.appendChild(btn);
      });
    }

    window.addEventListener('hashchange', () => render(location.hash.slice(1)));
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'h') stage.classList.toggle('show-hotspots');
      if (key === 'escape') { stage.classList.remove('show-hotspots'); }
      // 快捷键 1-8：与下方菜单一致。
      const shortcuts = ['home','sync1','discharge','status','warning','backend','tour','ops'];
      if (/^[1-8]$/.test(key)) setHash(shortcuts[Number(key) - 1]);
    });

    Object.values(screens).forEach(item => { const preload = new Image(); preload.src = item.src; });
    render(location.hash.slice(1) || defaultScreen);
  </script>
