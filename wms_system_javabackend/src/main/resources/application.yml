server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wms-system-backend
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  demo:
    enabled: true
    config-path: ${WMS_DEEPSEEK_CONFIG:../project/local/deepseek.env}
  database:
    path: ${WMS_DB_PATH:../db/wms_demo.sqlite}
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
